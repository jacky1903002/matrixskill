<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工廠個人技能矩陣表系統</title>
    <!-- Tailwind CSS 樣式與字型 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS 用於 Excel 匯出入 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- html2canvas 用於匯出高畫質 PNG -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        /* 經典科技藍扇形等級圖示樣式 (conic-gradient) */
        .pie-chart {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #bfdbfe;
            background-color: #eff6ff;
            vertical-align: middle;
        }
        .pie-1 { background-image: conic-gradient(#2563eb 0deg 90deg, #eff6ff 90deg 360deg); } /* 1/4圓 */
        .pie-2 { background-image: conic-gradient(#2563eb 0deg 180deg, #eff6ff 180deg 360deg); } /* 2/4圓 */
        .pie-3 { background-image: conic-gradient(#2563eb 0deg 270deg, #eff6ff 270deg 360deg); } /* 3/4圓 */
        .pie-4 { background-color: #2563eb; } /* 全圓 */
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 登入驗證遮罩層 -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900 bg-opacity-60 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md border border-slate-100">
            <div class="text-center mb-6">
                <span class="text-4xl">🏭</span>
                <h2 class="text-2xl font-bold text-slate-800 mt-2">工廠技能矩陣系統</h2>
                <p class="text-xs text-slate-500 mt-1">請登入您的企業帳號以存取數據</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">電子郵件帳號</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">密碼</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                </div>
                <div id="login-error" class="text-rose-600 text-xs font-medium hidden"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 px-4 rounded-lg shadow-md hover:shadow-lg transition font-semibold">安全登入</button>
            </form>
        </div>
    </div>

    <!-- 主應用程式介面 -->
    <div id="app-container" class="flex-1 flex flex-col hidden">
        <!-- 頂端導覽列 -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4 shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-blue-50 rounded-lg text-blue-600 text-xl font-bold shadow-inner">📊</div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">工廠個人技能矩陣管理系統</h1>
                    <p class="text-xs text-slate-500">Enterprise Multi-Skill Matrix Dashboard</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="exportAllExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition flex items-center space-x-1.5">
                    <span>📥</span><span>匯出完整 Excel</span>
                </button>
                <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer flex items-center space-x-1.5">
                    <span>📤</span><span>匯入 Excel 總表</span>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="hidden" onchange="importAllExcel(event)">
                </label>
            </div>

            <div class="flex items-center space-x-5 text-xs text-slate-600">
                <div class="flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                    <span id="connection-dot" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                    <span id="connection-status" class="font-medium">檢查中...</span>
                </div>
                <div>更新時間：<span id="last-update-time" class="font-semibold text-slate-800">-</span></div>
                <div class="flex items-center space-x-3 border-l pl-4 border-slate-200">
                    <span id="user-email" class="font-semibold text-slate-700"></span>
                    <button onclick="handleLogout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md font-medium transition">登出</button>
                </div>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="flex-1 max-w-[96rem] w-full mx-auto px-6 py-6 space-y-6">
            
            <!-- 1. 最上方：部門列表切換 -->
            <div class="bg-white rounded-xl shadow-sm p-4 border border-slate-200">
                <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">🏭 選擇部門工作表</div>
                <nav id="department-tabs" class="flex flex-wrap gap-2">
                    <!-- 動態生成部門標籤 -->
                </nav>
            </div>

            <!-- 主排版區 -->
            <div class="space-y-6">
                
                <!-- 2. 上方：個人技能矩陣總覽統計 (含全廠/部門下拉選單) -->
                <div id="export-card-matrix" class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                    <div class="flex flex-wrap justify-between items-center mb-4 pb-3 border-b border-slate-100 gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="w-3 h-6 bg-blue-600 rounded-sm"></span>
                            <h3 class="text-base font-bold text-slate-900">個人技能矩陣總覽統計</h3>
                            <!-- 下拉選單：全廠 / 各部門 -->
                            <select id="summary-scope-select" onchange="updateSummaryScope(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs font-semibold rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                                <option value="全廠">🌐 全廠總計</option>
                                <!-- 動態填入部門選項 -->
                            </select>
                        </div>
                        <button onclick="exportElementAsPNG('export-card-matrix', '個人技能矩陣總覽統計')" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1 shadow-sm">
                            <span>📸</span><span>匯出矩陣 PNG</span>
                        </button>
                    </div>
                    <div id="matrix-summary" class="text-sm text-slate-600 space-y-2">
                        <!-- 動態生成統計分析 -->
                    </div>
                </div>

                <!-- 3. 中間：線上編輯人員評分表單 -->
                <div class="bg-gradient-to-r from-blue-50 via-slate-50 to-indigo-50 rounded-xl shadow-sm p-5 border border-blue-100">
                    <div class="flex items-center justify-between mb-3">
                        <h3 id="form-title" class="text-sm font-bold text-slate-800 flex items-center space-x-1.5">
                            <span>✍️</span><span>線上編輯人員評分表單（點擊下方矩陣列表可帶入或直接新增）</span>
                        </h3>
                        <span class="text-xs text-blue-700 font-medium bg-blue-100 px-2 py-0.5 rounded">數值範圍: 1 ~ 4</span>
                    </div>
                    
                    <form id="skill-form" onsubmit="saveSkillData(event)" class="flex flex-wrap items-end gap-3">
                        <div class="flex-1 min-w-[140px]">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">人員代號 / 姓名</label>
                            <input type="text" id="input-person" required placeholder="例如：A, B, 員工姓名" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 a</label>
                            <input type="number" min="1" max="4" id="input-skill-a" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 b</label>
                            <input type="number" min="1" max="4" id="input-skill-b" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 c</label>
                            <input type="number" min="1" max="4" id="input-skill-c" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 d</label>
                            <input type="number" min="1" max="4" id="input-skill-d" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 e</label>
                            <input type="number" min="1" max="4" id="input-skill-e" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 f</label>
                            <input type="number" min="1" max="4" id="input-skill-f" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="w-20">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">技能 g</label>
                            <input type="number" min="1" max="4" id="input-skill-g" required class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm text-center">
                        </div>
                        <div class="flex items-center space-x-2 pt-1">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-sm transition">儲存更新</button>
                            <button type="button" onclick="resetForm()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">重設</button>
                        </div>
                    </form>
                </div>

                <!-- 4. 下方：部門詳細技能矩陣表 (技能等級標準已移至右側標題列)[cite: 6] -->
                <div id="export-card-table" class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                    <div class="flex flex-wrap justify-between items-center mb-5 pb-3 border-b border-slate-100 gap-3">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-6 bg-blue-600 rounded-sm"></span>
                            <h3 id="current-dept-title" class="text-base font-bold text-slate-900">部門詳細技能矩陣表</h3>
                        </div>
                        
                        <!-- 技能等級標準 (已移至表格右側標題列)[cite: 6] -->
                        <div class="flex flex-wrap items-center gap-3 text-xs text-slate-700 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">
                            <span class="font-bold text-slate-900">💡 技能等級標準：</span>
                            <div class="flex items-center space-x-1"><span class="pie-chart pie-1" style="width:18px;height:18px;"></span><span><b>1:</b> 訓練中</span></div>
                            <div class="flex items-center space-x-1"><span class="pie-chart pie-2" style="width:18px;height:18px;"></span><span><b>2:</b> 能獨立作業</span></div>
                            <div class="flex items-center space-x-1"><span class="pie-chart pie-3" style="width:18px;height:18px;"></span><span><b>3:</b> 技術熟練</span></div>
                            <div class="flex items-center space-x-1"><span class="pie-chart pie-4" style="width:18px;height:18px;"></span><span><b>4:</b> 導師級</span></div>
                        </div>

                        <div class="flex items-center space-x-3">
                            <span class="text-xs text-slate-400 bg-slate-50 px-2.5 py-1 rounded border border-slate-100">💡 點擊下方表格任一列可載入資料到上方進行編輯</span>
                            <button onclick="exportElementAsPNG('export-card-table', '部門詳細矩陣表')" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-1 shadow-sm">
                               <span>📸</span><span>匯出表格 PNG</span>
                            </button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-slate-200 text-center text-sm">
                            <thead class="bg-slate-50 text-slate-700 font-semibold uppercase text-xs tracking-wider">
                                <tr>
                                    <th class="px-4 py-3 text-left">人員 / 技能代號</th>
                                    <th class="px-4 py-3">技能 a</th>
                                    <th class="px-4 py-3">技能 b</th>
                                    <th class="px-4 py-3">技能 c</th>
                                    <th class="px-4 py-3">技能 d</th>
                                    <th class="px-4 py-3">技能 e</th>
                                    <th class="px-4 py-3">技能 f</th>
                                    <th class="px-4 py-3">技能 g</th>
                                    <th class="px-4 py-3 text-right">操作管理</th>
                                </tr>
                            </thead>
                            <tbody id="dept-table-body" class="divide-y divide-slate-100 bg-white">
                                <!-- 動態載入 -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

            "製造五部": { "A": {a:4, b:4, c:3, d:4, e:2, f:4, g:4}, "B": {a:4, b:4, c:4, d:4, e:3, f:3, g:1}, "C": {a:4, b:4, c:4, d:4, e:4, f:4, g:1}, "D": {a:1, b:1, c:2, d:4, e:1, f:3, g:4}, "E": {a:1, b:3, c:3, d:3, e:1, f:4, g:1}, "F": {a:3, b:4, c:1, d:4, e:1, f:3, g:4}, "G": {a:2, b:2, c:3, d:4, e:4, f:3, g:1} },
            "乾式製程課": { "A": {a:4, b:2, c:2, d:4, e:3, f:1, g:2}, "B": {a:4, b:2, c:1, d:4, e:4, f:2, g:4}, "C": {a:4, b:4, c:1, d:3, e:1, f:1, g:2}, "D": {a:4, b:3, c:1, d:2, e:1, f:1, g:2}, "E": {a:4, b:2, c:4, d:1, e:1, f:4, g:3}, "F": {a:4, b:2, c:2, d:1, e:4, f:3, g:1}, "G": {a:1, b:1, c:2, d:1, e:2, f:3, g:1} },
            "濕式製程課": { "A": {a:4, b:4, c:4, d:3, e:4, f:2, g:2}, "B": {a:2, b:3, c:1, d:2, e:3, f:2, g:2}, "C": {a:2, b:1, c:4, d:2, e:3, f:4, g:3}, "D": {a:1, b:1, c:1, d:4, e:1, f:3, g:1}, "E": {a:4, b:4, c:3, d:2, e:2, f:4, g:3}, "F": {a:2, b:4, c:2, d:2, e:4, f:4, g:4}, "G": {a:4, b:1, c:2, d:1, e:2, f:3, g:4} },
            "產品開發部": { "A": {a:3, b:2, c:3, d:3, e:3, f:2, g:4}, "B": {a:1, b:3, c:2, d:1, e:4, f:2, g:3}, "C": {a:4, b:4, c:1, d:2, e:3, f:2, g:2}, "D": {a:4, b:3, c:4, d:3, e:2, f:2, g:1}, "E": {a:3, b:3, c:2, d:1, e:4, f:1, g:1}, "F": {a:3, b:4, c:3, d:2, e:3, f:2, g:4}, "G": {a:3, b:3, c:3, d:1, e:4, f:2, g:1} }
        };

        let currentDept = departments[0];
        let currentSummaryScope = '全廠';
        let globalSkillsData = {};

        function initSummarySelect() {
            const select = document.getElementById('summary-scope-select');
            let optionsHtml = `<option value="全廠">🌐 全廠總計</option>`;
            departments.forEach(dept => {
                optionsHtml += `<option value="${dept}">${dept}</option>`;
            });
            select.innerHTML = optionsHtml;
            select.value = currentSummaryScope;
        }

        window.updateSummaryScope = function(scope) {
            currentSummaryScope = scope;
            renderSummary();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('department-tabs');
            tabsContainer.innerHTML = '';
            departments.forEach(dept => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 text-xs font-semibold rounded-lg transition ${dept === currentDept ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`;
                btn.innerText = dept;
                btn.onclick = () => {
                    currentDept = dept;
                    renderTabs();
                    renderDeptTable();
                };
                tabsContainer.appendChild(btn);
            });
            document.getElementById('current-dept-title').innerText = `${currentDept} - 詳細技能矩陣表`;
        }

        window.renderDeptTable = function() {
            renderTabs();
            const tbody = document.getElementById('dept-table-body');
            tbody.innerHTML = '';
            
            const deptData = globalSkillsData[currentDept] || {};
            
            if (Object.keys(deptData).length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-6 text-slate-400">目前尚無資料</td></tr>`;
                renderSummary();
                return;
            }

            for (const [person, skills] of Object.entries(deptData)) {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 cursor-pointer transition';
                tr.onclick = () => fillForm(person, skills);
                
                let rowHtml = `<td class="px-4 py-3 font-bold text-slate-800 bg-slate-50 text-left">${person}</td>`;
                ['a', 'b', 'c', 'd', 'e', 'f', 'g'].forEach(k => {
                    const val = parseInt(skills[k] || 1);
                    rowHtml += `<td class="px-4 py-3"><span class="pie-chart pie-${val}" title="等級 ${val}"></span></td>`;
                });
                rowHtml += `<td class="px-4 py-3 text-right"><button onclick="event.stopPropagation(); deleteSkill('${person}')" class="text-xs text-rose-600 hover:text-rose-800 font-medium bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded transition">刪除</button></td>`;
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            }

            renderSummary();
        }

        function renderSummary() {
            let levelCounts = {1: 0, 2: 0, 3: 0, 4: 0};
            let totalScores = 0;
            let totalEntries = 0;

            if (currentSummaryScope === '全廠') {
                departments.forEach(dept => {
                    const deptData = globalSkillsData[dept] || {};
                    for (const person of Object.values(deptData)) {
                        ['a', 'b', 'c', 'd', 'e', 'f', 'g'].forEach(k => {
                            const val = parseInt(person[k] || 1);
                            levelCounts[val]++;
                            totalScores += val;
                            totalEntries++;
                        });
                    }
                });
            } else {
                const deptData = globalSkillsData[currentSummaryScope] || {};
                for (const person of Object.values(deptData)) {
                    ['a', 'b', 'c', 'd', 'e', 'f', 'g'].forEach(k => {
                        const val = parseInt(person[k] || 1);
                        levelCounts[val]++;
                        totalScores += val;
                        totalEntries++;
                    });
                }
            }

            const avgScore = totalEntries > 0 ? (totalScores / totalEntries).toFixed(2) : 0;
            const summaryDiv = document.getElementById('matrix-summary');
            summaryDiv.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 text-center">
                    <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100 flex items-center justify-center space-x-3 shadow-sm">
                        <span class="pie-chart pie-1"></span>
                        <div class="text-left"><div class="text-xs text-blue-700 font-bold">1: 訓練中</div><div class="text-lg font-extrabold text-blue-900">${levelCounts[1]} 項</div></div>
                    </div>
                    <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100 flex items-center justify-center space-x-3 shadow-sm">
                        <span class="pie-chart pie-2"></span>
                        <div class="text-left"><div class="text-xs text-blue-700 font-bold">2: 獨立作業</div><div class="text-lg font-extrabold text-blue-900">${levelCounts[2]} 項</div></div>
                    </div>
                    <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100 flex items-center justify-center space-x-3 shadow-sm">
                        <span class="pie-chart pie-3"></span>
                        <div class="text-left"><div class="text-xs text-blue-700 font-bold">3: 技術熟練</div><div class="text-lg font-extrabold text-blue-900">${levelCounts[3]} 項</div></div>
                    </div>
                    <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100 flex items-center justify-center space-x-3 shadow-sm">
                        <span class="pie-chart pie-4"></span>
                        <div class="text-left"><div class="text-xs text-blue-700 font-bold">4: 導師級</div><div class="text-lg font-extrabold text-blue-900">${levelCounts[4]} 項</div></div>
                    </div>
                </div>
                <div class="text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center font-semibold">
                    <span>📊 [${currentSummaryScope}] 整體平均技術熟練度評分：</span>
                    <span class="font-bold text-blue-600 text-xl">${avgScore} 分 / 4.0 分</span>
                </div>
            `;
        }

        window.exportAllExcel = function() {
            const wb = XLSX.utils.book_new();
            departments.forEach(dept => {
                const deptData = globalSkillsData[dept] || {};
                const rows = [];
                for (const [person, skills] of Object.entries(deptData)) {
                    rows.push({
                        "人員/技能": person,
                        "a": skills.a,
                        "b": skills.b,
                        "c": skills.c,
                        "d": skills.d,
                        "e": skills.e,
                        "f": skills.f,
                        "g": skills.g
                    });
                }
                const ws = XLSX.utils.json_to_sheet(rows.length > 0 ? rows : [{"人員/技能": "範例", "a":1, "b":1, "c":1, "d":1, "e":1, "f":1, "g":1}]);
                XLSX.utils.book_append_sheet(wb, ws, dept);
            });
            XLSX.writeFile(wb, "工廠個人技能矩陣表_完整資料.xlsx");
        }

        window.importAllExcel = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let importedData = JSON.parse(JSON.stringify(globalSkillsData));
                    let matchCount = 0;

                    workbook.SheetNames.forEach(sheetName => {
                        if (departments.includes(sheetName)) {
                            const worksheet = workbook.Sheets[sheetName];
                            const json = XLSX.utils.sheet_to_json(worksheet);
                            
                            let deptMap = {};
                            json.forEach(row => {
                                const personKey = row["人員/技能"] || row["人員"] || row["Name"];
                                if (personKey) {
                                    deptMap[personKey] = {
                                        a: parseInt(row["a"] || 1),
                                        b: parseInt(row["b"] || 1),
                                        c: parseInt(row["c"] || 1),
                                        d: parseInt(row["d"] || 1),
                                        e: parseInt(row["e"] || 1),
                                        f: parseInt(row["f"] || 1),
                                        g: parseInt(row["g"] || 1)
                                    };
                                }
                            });

                            if (Object.keys(deptMap).length > 0) {
                                importedData[sheetName] = deptMap;
                                matchCount++;
                            }
                        }
                    });

                    if (matchCount > 0) {
                        await set(ref(db, 'skills'), importedData);
                        await set(ref(db, 'lastUpdated'), serverTimestamp());
                        alert(`成功匯入！共比對並更新了 ${matchCount} 個相符的工作表。`);
                    } else {
                        alert('匯入失敗：上傳的 Excel 中沒有任何工作表名稱與系統的 11 個部門相符！');
                    }
                } catch (err) {
                    alert('解析 Excel 檔案發生錯誤： ' + err.message);
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.exportElementAsPNG = function(elementId, titleName) {
            const element = document.getElementById(elementId);
            if (!element) return;

            html2canvas(element, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${currentSummaryScope}_${titleName}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                alert('匯出圖片失敗： ' + err.message);
            });
        }

        window.fillForm = function(person, skills) {
            document.getElementById('input-person').value = person;
            document.getElementById('input-skill-a').value = skills.a;
            document.getElementById('input-skill-b').value = skills.b;
            document.getElementById('input-skill-c').value = skills.c;
            document.getElementById('input-skill-d').value = skills.d;
            document.getElementById('input-skill-e').value = skills.e;
            document.getElementById('input-skill-f').value = skills.f;
            document.getElementById('input-skill-g').value = skills.g;
            document.getElementById('form-title').innerHTML = `<span>✍️</span><span>正在編輯人員：<strong class="text-blue-600">${person}</strong></span>`;
        }

        window.resetForm = function() {
            document.getElementById('skill-form').reset();
            document.getElementById('form-title').innerHTML = `<span>✍️</span><span>線上編輯人員評分表單（點擊下方矩陣列表可帶入或直接新增）</span>`;
        }

        window.saveSkillData = async function(event) {
            event.preventDefault();
            const person = document.getElementById('input-person').value.trim();
            const skills = {
                a: parseInt(document.getElementById('input-skill-a').value),
                b: parseInt(document.getElementById('input-skill-b').value),
                c: parseInt(document.getElementById('input-skill-c').value),
                d: parseInt(document.getElementById('input-skill-d').value),
                e: parseInt(document.getElementById('input-skill-e').value),
                f: parseInt(document.getElementById('input-skill-f').value),
                g: parseInt(document.getElementById('input-skill-g').value)
            };

            const path = `skills/${currentDept}/${person}`;
            try {
                await set(ref(db, path), skills);
                await set(ref(db, 'lastUpdated'), serverTimestamp());
                alert('資料儲存成功！');
                resetForm();
            } catch (error) {
                alert('儲存失敗： ' + error.message);
            }
        }

        window.deleteSkill = async function(person) {
            if (confirm(`確定要刪除 ${person} 的資料嗎？`)) {
                try {
                    await set(ref(db, `skills/${currentDept}/${person}`), null);
                    await set(ref(db, 'lastUpdated'), serverTimestamp());
                } catch (error) {
                    alert('刪除失敗： ' + error.message);
                }
            }
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('login-modal').classList.add('hidden');
            } catch (error) {
                errorDiv.innerText = '登入失敗：帳號或密碼錯誤';
                errorDiv.classList.remove('hidden');
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
        }

        onAuthStateChanged(auth, async (user) => {
            const loginModal = document.getElementById('login-modal');
            const appContainer = document.getElementById('app-container');
            const userEmailSpan = document.getElementById('user-email');

            if (user) {
                loginModal.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userEmailSpan.innerText = user.email;

                initSummarySelect();

                const dataRef = ref(db, 'skills');
                const snapshot = await get(dataRef);
                if (!snapshot.exists()) {
                    await set(dataRef, defaultData);
                    await set(ref(db, 'lastUpdated'), serverTimestamp());
                }

                onValue(dataRef, (snapshot) => {
                    globalSkillsData = snapshot.val() || {};
                    renderDeptTable();
                });

                onValue(ref(db, 'lastUpdated'), (snapshot) => {
                    const timestamp = snapshot.val();
                    if (timestamp) {
                        const date = new Date(timestamp);
                        document.getElementById('last-update-time').innerText = date.toLocaleString('zh-TW');
                    } else {
                        document.getElementById('last-update-time').innerText = new Date().toLocaleString('zh-TW');
                    }
                });

            } else {
                appContainer.classList.add('hidden');
                loginModal.classList.remove('hidden');
            }
        });

        onValue(ref(db, '.info/connected'), (snap) => {
            const connected = snap.val();
            const dot = document.getElementById('connection-dot');
            const statusText = document.getElementById('connection-status');
            if (connected) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse';
                statusText.innerText = '線上連線中';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                statusText.innerText = '連線中斷';
            }
        });
    </script>
</body>
</html>
